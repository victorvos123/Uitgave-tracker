<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Uitgave Tracker</title>
  <meta name="description" content="Houd eenvoudig je uitgaven bij" />
  <meta name="theme-color" content="#1a1a1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Uitgaven" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f5f4f0;
      --surface: #ffffff;
      --surface2: #eeede9;
      --border: rgba(0,0,0,0.08);
      --border2: rgba(0,0,0,0.14);
      --text: #1a1a1a;
      --text2: #666;
      --text3: #999;
      --accent: #1a1a1a;
      --accent-text: #ffffff;
      --success-bg: #e8f5e9;
      --success-border: #a5d6a7;
      --success-text: #2e7d32;
      --info-bg: #e8f0fe;
      --info-border: #90b0f8;
      --info-text: #1a56db;
      --danger-text: #c0392b;
      --radius: 10px;
      --radius-lg: 14px;
      --nav-h: 64px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111110;
        --surface: #1c1c1a;
        --surface2: #252522;
        --border: rgba(255,255,255,0.07);
        --border2: rgba(255,255,255,0.13);
        --text: #f0efe9;
        --text2: #999;
        --text3: #666;
        --accent: #f0efe9;
        --accent-text: #111110;
        --success-bg: #1a2e1b;
        --success-border: #2e5e30;
        --success-text: #81c784;
        --info-bg: #161e30;
        --info-border: #2a4a9e;
        --info-text: #90b0f8;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: var(--bg); font-family: 'DM Sans', sans-serif; color: var(--text); overscroll-behavior: none; }
    #app { max-width: 430px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; background: var(--bg); position: relative; }
    .screen { display: none; flex: 1; overflow-y: auto; padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 1rem); }
    .screen.active { display: block; }
    nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; height: calc(var(--nav-h) + var(--safe-bottom)); padding-bottom: var(--safe-bottom); background: var(--surface); border-top: 0.5px solid var(--border); display: flex; z-index: 100; }
    .nav-btn { flex: 1; background: none; border: none; cursor: pointer; font-size: 10px; color: var(--text3); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-family: 'DM Sans', sans-serif; transition: color 0.15s; }
    .nav-btn i { font-size: 22px; }
    .nav-btn.active { color: var(--text); }

    /* Add screen */
    .amount-block { padding: 2rem 1.5rem 1rem; text-align: center; }
    .amount-label { font-size: 12px; color: var(--text3); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px; }
    .amount-value { font-family: 'DM Mono', monospace; font-size: 48px; font-weight: 500; color: var(--text); letter-spacing: -2px; }
    .amount-value.has-value { color: var(--text); }
    .pad-area { padding: 0 1rem; }
    .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 1rem; }
    .num-btn { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 18px 8px; font-size: 20px; font-weight: 500; color: var(--text); cursor: pointer; font-family: 'DM Mono', monospace; transition: background 0.1s; }
    .num-btn:active { background: var(--surface2); }
    .cat-section { padding: 0 1rem 1rem; }
    .section-label { font-size: 11px; color: var(--text3); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
    .cat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 1rem; }
    .cat-btn { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 11px 10px; font-size: 13px; color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 8px; font-family: 'DM Sans', sans-serif; transition: all 0.12s; }
    .cat-btn i { font-size: 17px; color: var(--text2); }
    .cat-btn.selected { background: var(--info-bg); border-color: var(--info-border); color: var(--info-text); }
    .cat-btn.selected i { color: var(--info-text); }
    .note-input { width: 100%; padding: 11px 14px; font-size: 14px; border: 0.5px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); margin-bottom: 1rem; font-family: 'DM Sans', sans-serif; outline: none; }
    .note-input:focus { border-color: var(--border2); }
    .save-btn { width: 100%; padding: 15px; background: var(--accent); color: var(--accent-text); border: none; border-radius: var(--radius-lg); font-size: 15px; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: opacity 0.15s; }
    .save-btn:disabled { opacity: 0.25; cursor: default; }

    /* Overview */
    .page-pad { padding: 1.25rem 1rem 0; }
    .month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
    .month-nav-btn { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); width: 32px; height: 32px; cursor: pointer; color: var(--text2); display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .month-name { font-size: 15px; font-weight: 500; }
    .total-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; }
    .total-lbl { font-size: 12px; color: var(--text3); margin-bottom: 4px; }
    .total-val { font-family: 'DM Mono', monospace; font-size: 28px; font-weight: 500; letter-spacing: -1px; }
    .total-icon { font-size: 32px; color: var(--text3); }
    .cat-rows { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
    .cat-row { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 0.5px solid var(--border); }
    .cat-row:last-child { border-bottom: none; }
    .row-icon { width: 32px; height: 32px; border-radius: 8px; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 15px; color: var(--text2); flex-shrink: 0; }
    .row-info { flex: 1; min-width: 0; }
    .row-name { font-size: 13px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-bar-wrap { height: 3px; background: var(--surface2); border-radius: 2px; }
    .row-bar { height: 3px; border-radius: 2px; background: var(--text); }
    .row-amt { font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500; }

    /* Entries */
    .entries-list { padding: 0 1rem; }
    .day-group { margin-bottom: 1rem; }
    .day-label { font-size: 11px; color: var(--text3); letter-spacing: 0.07em; text-transform: uppercase; padding: 0.75rem 0 0.4rem; }
    .entry-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); display: flex; align-items: center; gap: 10px; padding: 11px 12px; margin-bottom: 5px; }
    .entry-icon { width: 32px; height: 32px; border-radius: 8px; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 15px; color: var(--text2); flex-shrink: 0; }
    .entry-info { flex: 1; min-width: 0; }
    .entry-cat { font-size: 13px; }
    .entry-note { font-size: 11px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .entry-amt { font-family: 'DM Mono', monospace; font-size: 14px; font-weight: 500; }

    /* Manage */
    .manage-list { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 1rem; }
    .manage-item { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 0.5px solid var(--border); }
    .manage-item:last-child { border-bottom: none; }
    .m-icon { width: 32px; height: 32px; border-radius: 8px; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 15px; color: var(--text2); flex-shrink: 0; }
    .m-lbl { flex: 1; font-size: 14px; }
    .del-btn { background: none; border: none; cursor: pointer; color: var(--text3); font-size: 18px; padding: 4px; display: flex; align-items: center; transition: color 0.1s; }
    .del-btn:hover { color: var(--danger-text); }
    .add-box { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1rem; }
    .add-box-label { font-size: 12px; color: var(--text3); letter-spacing: 0.07em; text-transform: uppercase; margin-bottom: 10px; }
    .add-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .add-input { flex: 1; padding: 10px 12px; font-size: 14px; border: 0.5px solid var(--border); border-radius: var(--radius); background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; outline: none; }
    .add-input:focus { border-color: var(--border2); }
    .icon-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin-bottom: 10px; }
    .icon-opt { background: var(--bg); border: 0.5px solid var(--border); border-radius: 8px; padding: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--text2); transition: all 0.1s; }
    .icon-opt.selected { background: var(--info-bg); border-color: var(--info-border); color: var(--info-text); }
    .add-cat-btn { width: 100%; padding: 11px; background: var(--accent); color: var(--accent-text); border: none; border-radius: var(--radius); font-size: 14px; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; }
    .add-cat-btn:disabled { opacity: 0.25; cursor: default; }

    .entry-right { display: flex; align-items: center; gap: 8px; }
    .del-entry-btn { background: none; border: none; cursor: pointer; color: var(--text3); font-size: 16px; padding: 4px; display: flex; align-items: center; transition: color 0.1s; }
    .del-entry-btn:hover { color: var(--danger-text); } padding: 3rem 1rem; color: var(--text3); font-size: 14px; }
    .empty i { font-size: 36px; display: block; margin-bottom: 8px; }

    .flash { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--success-bg); border: 0.5px solid var(--success-border); color: var(--success-text); padding: 13px 22px; border-radius: var(--radius-lg); font-size: 14px; font-weight: 500; display: none; z-index: 200; white-space: nowrap; pointer-events: none; }

    .page-title { font-size: 20px; font-weight: 500; margin-bottom: 1.25rem; }
  </style>
</head>
<body>
<div id="app">
  <div class="flash" id="flash"><i class="ti ti-check"></i> Opgeslagen!</div>

  <!-- Invoeren -->
  <div class="screen active" id="screen-add">
    <div class="amount-block">
      <div class="amount-label">Bedrag</div>
      <div class="amount-value" id="display">€ 0</div>
    </div>
    <div class="pad-area">
      <div class="numpad">
        <button class="num-btn" onclick="n('1')">1</button><button class="num-btn" onclick="n('2')">2</button><button class="num-btn" onclick="n('3')">3</button>
        <button class="num-btn" onclick="n('4')">4</button><button class="num-btn" onclick="n('5')">5</button><button class="num-btn" onclick="n('6')">6</button>
        <button class="num-btn" onclick="n('7')">7</button><button class="num-btn" onclick="n('8')">8</button><button class="num-btn" onclick="n('9')">9</button>
        <button class="num-btn" onclick="n('.')">.</button><button class="num-btn" onclick="n('0')">0</button>
        <button class="num-btn" onclick="del()"><i class="ti ti-backspace"></i></button>
      </div>
    </div>
    <div class="cat-section">
      <div class="section-label">Categorie</div>
      <div class="cat-grid" id="cat-grid"></div>
      <input class="note-input" type="text" id="note" placeholder="Notitie (optioneel)" />
      <button class="save-btn" id="save-btn" onclick="save()" disabled>Opslaan</button>
    </div>
  </div>

  <!-- Overzicht -->
  <div class="screen" id="screen-overview">
    <div class="page-pad">
      <div class="month-nav">
        <button class="month-nav-btn" onclick="cm(-1)"><i class="ti ti-chevron-left"></i></button>
        <span class="month-name" id="month-lbl"></span>
        <button class="month-nav-btn" onclick="cm(1)"><i class="ti ti-chevron-right"></i></button>
      </div>
      <div class="total-card">
        <div><div class="total-lbl">Totaal uitgegeven</div><div class="total-val" id="total-val">€ 0</div></div>
        <i class="ti ti-chart-pie total-icon"></i>
      </div>
      <div class="cat-rows" id="cat-rows"></div>
    </div>
  </div>

  <!-- Lijst -->
  <div class="screen" id="screen-entries">
    <div class="page-pad" style="padding-bottom:0">
      <div class="page-title">Alle uitgaven</div>
    </div>
    <div class="entries-list" id="entries-list"></div>
  </div>

  <!-- Beheer -->
  <div class="screen" id="screen-manage">
    <div class="page-pad">
      <div class="page-title">Categorieën</div>
      <div class="manage-list" id="manage-list"></div>
      <div class="add-box">
        <div class="add-box-label">Nieuwe categorie</div>
        <div class="add-row">
          <input class="add-input" type="text" id="new-name" placeholder="Naam" maxlength="24" oninput="checkAdd()" />
        </div>
        <div class="icon-grid" id="icon-grid"></div>
        <button class="add-cat-btn" id="add-btn" onclick="addCat()" disabled>Toevoegen</button>
      </div>
    </div>
  </div>

  <nav>
    <button class="nav-btn active" id="nav-add" onclick="show('add')"><i class="ti ti-plus"></i>Invoeren</button>
    <button class="nav-btn" id="nav-overview" onclick="show('overview')"><i class="ti ti-chart-bar"></i>Overzicht</button>
    <button class="nav-btn" id="nav-entries" onclick="show('entries')"><i class="ti ti-list"></i>Lijst</button>
    <button class="nav-btn" id="nav-manage" onclick="show('manage')"><i class="ti ti-settings"></i>Beheer</button>
  </nav>
</div>

<script>
const DEFAULT_CATS = [
  {id:'boodschappen',label:'Boodschappen',icon:'ti-shopping-cart'},
  {id:'eten',label:'Horeca',icon:'ti-coffee'},
  {id:'transport',label:'Transport',icon:'ti-train'},
  {id:'kleding',label:'Kleding',icon:'ti-shirt'},
  {id:'abonnementen',label:'Abonnementen',icon:'ti-refresh'},
  {id:'sport',label:'Sport & gezondheid',icon:'ti-heartbeat'},
  {id:'entertainment',label:'Entertainment',icon:'ti-device-tv'},
  {id:'huur',label:'Huur',icon:'ti-home'},
  {id:'overig',label:'Overig',icon:'ti-dots'}
];
const ICONS = ['ti-shopping-bag','ti-coffee','ti-train','ti-shirt','ti-refresh','ti-heartbeat','ti-device-tv','ti-home','ti-car','ti-plane','ti-dog','ti-book','ti-tool','ti-gift','ti-phone','ti-music','ti-pill','ti-building','ti-briefcase','ti-pizza','ti-bike','ti-dots'];

const CATS_VERSION = '2';
let raw='', selCat=null, selIcon=null, mo=0, entries=[], cats=[];

function load(){
  try{entries=JSON.parse(localStorage.getItem('ut_e')||'[]');}catch{entries=[];}
  try{
    const v=localStorage.getItem('ut_cv');
    const s=localStorage.getItem('ut_c');
    if(v===CATS_VERSION&&s){cats=JSON.parse(s);}
    else{cats=[...DEFAULT_CATS];localStorage.setItem('ut_cv',CATS_VERSION);}
  }catch{cats=[...DEFAULT_CATS];}
}
function persist(){
  localStorage.setItem('ut_e',JSON.stringify(entries));
  localStorage.setItem('ut_c',JSON.stringify(cats));
  localStorage.setItem('ut_cv',CATS_VERSION);
}
function gc(id){return cats.find(c=>c.id===id)||{label:id,icon:'ti-dots'};}

function renderCats(){
  document.getElementById('cat-grid').innerHTML=cats.map(c=>
    `<button class="cat-btn${selCat===c.id?' selected':''}" onclick="sc('${c.id}')"><i class="ti ${c.icon}"></i>${c.label}</button>`
  ).join('');
}
function sc(id){selCat=id;renderCats();upd();}

function n(v){
  if(v==='.'&&raw.includes('.'))return;
  if(raw.length>=7)return;
  raw+=v;updDisp();upd();
}
function del(){raw=raw.slice(0,-1);updDisp();upd();}
function updDisp(){
  const val=parseFloat(raw)||0;
  const str=raw.endsWith('.')?val.toFixed(0)+'.':val%1===0?val.toFixed(0):val.toFixed(2);
  document.getElementById('display').textContent='€ '+str;
}
function upd(){document.getElementById('save-btn').disabled=!(parseFloat(raw)>0&&selCat);}

function save(){
  const amt=parseFloat(raw);
  if(!amt||!selCat)return;
  entries.push({id:Date.now(),amount:amt,cat:selCat,note:document.getElementById('note').value.trim(),date:new Date().toISOString()});
  persist();
  raw='';selCat=null;document.getElementById('note').value='';
  updDisp();renderCats();upd();
  const f=document.getElementById('flash');
  f.style.display='block';setTimeout(()=>f.style.display='none',1400);
}

function getME(o){
  const now=new Date(),d=new Date(now.getFullYear(),now.getMonth()+o,1);
  return entries.filter(e=>{const ed=new Date(e.date);return ed.getFullYear()===d.getFullYear()&&ed.getMonth()===d.getMonth();});
}
function mLbl(o){
  const now=new Date();
  return new Date(now.getFullYear(),now.getMonth()+o,1).toLocaleDateString('nl-NL',{month:'long',year:'numeric'});
}
function cm(d){mo+=d;if(mo>0)mo=0;renderOverview();}

function renderOverview(){
  document.getElementById('month-lbl').textContent=mLbl(mo);
  const me=getME(mo),total=me.reduce((s,e)=>s+e.amount,0);
  document.getElementById('total-val').textContent='€ '+total.toFixed(2);
  const bc={};me.forEach(e=>{bc[e.cat]=(bc[e.cat]||0)+e.amount;});
  const sorted=Object.entries(bc).sort((a,b)=>b[1]-a[1]);
  const max=sorted.length?sorted[0][1]:1;
  const el=document.getElementById('cat-rows');
  if(!sorted.length){el.innerHTML='<div class="empty"><i class="ti ti-receipt-off"></i>Geen uitgaven deze maand</div>';return;}
  el.innerHTML=sorted.map(([cid,amt])=>{
    const cat=gc(cid),pct=Math.round((amt/max)*100);
    return `<div class="cat-row"><div class="row-icon"><i class="ti ${cat.icon}"></i></div><div class="row-info"><div class="row-name">${cat.label}</div><div class="row-bar-wrap"><div class="row-bar" style="width:${pct}%"></div></div></div><div class="row-amt">€ ${amt.toFixed(2)}</div></div>`;
  }).join('');
}

function renderEntries(){
  const sorted=[...entries].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const el=document.getElementById('entries-list');
  if(!sorted.length){el.innerHTML='<div class="empty"><i class="ti ti-receipt-off"></i>Nog geen uitgaven</div>';return;}
  const groups={};
  sorted.forEach(e=>{
    const d=new Date(e.date),key=d.toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'});
    if(!groups[key])groups[key]=[];groups[key].push(e);
  });
  el.innerHTML=Object.entries(groups).map(([day,es])=>
    `<div class="day-group"><div class="day-label">${day}</div>${es.map(e=>{
      const cat=gc(e.cat);
      return `<div class="entry-card"><div class="entry-icon"><i class="ti ${cat.icon}"></i></div><div class="entry-info"><div class="entry-cat">${cat.label}</div>${e.note?`<div class="entry-note">${e.note}</div>`:''}</div><div class="entry-right"><div class="entry-amt">€ ${e.amount.toFixed(2)}</div><button class="del-entry-btn" onclick="delEntry(${e.id})"><i class="ti ti-trash"></i></button></div></div>`;
    }).join('')}</div>`
  ).join('');
}

function delEntry(id){
  entries=entries.filter(e=>e.id!==id);persist();renderEntries();renderOverview();
}

function renderManage(){
  document.getElementById('manage-list').innerHTML=cats.map(c=>
    `<div class="manage-item"><div class="m-icon"><i class="ti ${c.icon}"></i></div><div class="m-lbl">${c.label}</div><button class="del-btn" onclick="delCat('${c.id}')"><i class="ti ti-trash"></i></button></div>`
  ).join('');
  document.getElementById('icon-grid').innerHTML=ICONS.map(ic=>
    `<button class="icon-opt${selIcon===ic?' selected':''}" onclick="pi('${ic}')"><i class="ti ${ic}"></i></button>`
  ).join('');
}
function pi(ic){selIcon=ic;renderManage();checkAdd();}
function checkAdd(){
  document.getElementById('add-btn').disabled=!(document.getElementById('new-name').value.trim()&&selIcon);
}
function addCat(){
  const name=document.getElementById('new-name').value.trim();
  if(!name||!selIcon)return;
  cats.push({id:'cat_'+Date.now(),label:name,icon:selIcon});
  persist();document.getElementById('new-name').value='';selIcon=null;
  checkAdd();renderManage();renderCats();
}
function delCat(id){
  if(cats.length<=1)return;
  cats=cats.filter(c=>c.id!==id);persist();
  if(selCat===id){selCat=null;upd();}
  renderManage();renderCats();
}

function show(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.getElementById('nav-'+name).classList.add('active');
  if(name==='overview')renderOverview();
  if(name==='entries')renderEntries();
  if(name==='manage')renderManage();
}

load();renderCats();updDisp();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
