<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>doekoe</title>
  <meta name="description" content="Houd bewust je uitgaven bij" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="doekoe" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --surface2: #1a1a1a;
      --surface3: #222222;
      --border: rgba(255,255,255,0.06);
      --border2: rgba(255,255,255,0.12);
      --text: #f0f0f0;
      --text2: #888;
      --text3: #444;
      --accent: #f0f0f0;
      --accent-text: #0a0a0a;
      --green: #4ade80;
      --red: #f87171;
      --radius: 12px;
      --radius-lg: 18px;
      --nav-h: 68px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: var(--bg); font-family: 'Space Grotesk', sans-serif; color: var(--text); overscroll-behavior: none; }
    #app { max-width: 430px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; background: var(--bg); position: relative; overflow: hidden; }
    .screen { display: none; flex: 1; overflow-y: auto; padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 12px + 1rem); }
    .screen.active { display: block; }
    nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; height: calc(var(--nav-h) + var(--safe-bottom) + 12px); padding-bottom: calc(var(--safe-bottom) + 12px); background: rgba(10,10,10,0.95); border-top: 0.5px solid var(--border); display: flex; z-index: 100; }
    .nav-btn { flex: 1; background: none; border: none; cursor: pointer; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text3); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-family: 'Space Grotesk', sans-serif; transition: color 0.2s; }
    .nav-btn i { font-size: 20px; }
    .nav-btn.active { color: var(--text); }
    .add-header { padding: 3rem 1.5rem 1rem; }
    .date-lbl { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text3); margin-bottom: 1.5rem; font-family: 'Space Mono', monospace; }
    .amount-value { font-family: 'Space Mono', monospace; font-size: 56px; font-weight: 700; color: var(--text); letter-spacing: -3px; line-height: 1; margin-bottom: 2rem; }
    .amount-value.empty { color: var(--text3); }
    .pad-area { padding: 0 1rem; }
    .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 1.5rem; }
    .num-btn { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 20px 8px; font-size: 22px; font-weight: 400; color: var(--text); cursor: pointer; font-family: 'Space Mono', monospace; transition: background 0.1s; }
    .num-btn:active { background: var(--surface3); }
    .cat-section { padding: 0 1rem 1rem; }
    .section-lbl { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text3); margin-bottom: 10px; font-family: 'Space Mono', monospace; }
    .cat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 1rem; }
    .cat-btn { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 12px 10px; font-size: 13px; color: var(--text2); cursor: pointer; display: flex; align-items: center; gap: 8px; font-family: 'Space Grotesk', sans-serif; transition: all 0.15s; }
    .cat-btn i { font-size: 16px; }
    .cat-btn.selected { background: var(--surface3); border-color: var(--border2); color: var(--text); }
    .note-input { width: 100%; padding: 13px 14px; font-size: 14px; border: 0.5px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); margin-bottom: 1rem; font-family: 'Space Grotesk', sans-serif; outline: none; }
    .note-input::placeholder { color: var(--text3); }
    .note-input:focus { border-color: var(--border2); }
    .save-btn { width: 100%; padding: 17px; background: var(--accent); color: var(--accent-text); border: none; border-radius: var(--radius-lg); font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; font-family: 'Space Grotesk', sans-serif; transition: opacity 0.15s; }
    .save-btn:disabled { opacity: 0.15; cursor: default; }
    .overview-top { padding: 3rem 1.5rem 1.5rem; }
    .ov-month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; }
    .ov-month-btn { background: none; border: 0.5px solid var(--border); border-radius: 8px; width: 30px; height: 30px; cursor: pointer; color: var(--text2); display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .ov-month-name { font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--text2); text-transform: uppercase; }
    .ov-total-lbl { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text3); font-family: 'Space Mono', monospace; margin-bottom: 8px; }
    .ov-total-val { font-family: 'Space Mono', monospace; font-size: 48px; font-weight: 700; letter-spacing: -2px; line-height: 1; margin-bottom: 2rem; }
    .chart-wrap { margin: 0 1rem 1.5rem; background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; }
    .chart-lbl { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text3); font-family: 'Space Mono', monospace; margin-bottom: 1rem; }
    #line-chart { width: 100%; height: 100px; display: block; }
    .cat-overview { padding: 0 1rem; }
    .cat-ov-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 0.5px solid var(--border); }
    .cat-ov-row:last-child { border-bottom: none; }
    .cat-ov-icon { width: 34px; height: 34px; border-radius: 10px; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 15px; color: var(--text2); flex-shrink: 0; }
    .cat-ov-info { flex: 1; min-width: 0; }
    .cat-ov-name { font-size: 13px; color: var(--text); margin-bottom: 5px; }
    .cat-ov-bar-wrap { height: 2px; background: var(--surface3); border-radius: 1px; }
    .cat-ov-bar { height: 2px; border-radius: 1px; background: var(--text2); }
    .cat-ov-amt { font-family: 'Space Mono', monospace; font-size: 13px; color: var(--text); }
    .entries-pad { padding: 3rem 1rem 0; }
    .page-title { font-family: 'Space Mono', monospace; font-size: 20px; font-weight: 700; margin-bottom: 1.5rem; letter-spacing: -0.5px; }
    .day-lbl { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text3); font-family: 'Space Mono', monospace; padding: 0.75rem 0 0.5rem; }
    .entry-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); display: flex; align-items: center; gap: 12px; padding: 13px; margin-bottom: 6px; }
    .entry-icon { width: 34px; height: 34px; border-radius: 10px; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 15px; color: var(--text2); flex-shrink: 0; }
    .entry-info { flex: 1; min-width: 0; }
    .entry-cat { font-size: 13px; color: var(--text); }
    .entry-note { font-size: 11px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .entry-right { display: flex; align-items: center; gap: 10px; }
    .entry-amt { font-family: 'Space Mono', monospace; font-size: 14px; font-weight: 700; color: var(--text); }
    .del-entry-btn { background: none; border: none; cursor: pointer; color: var(--text3); font-size: 16px; padding: 4px; display: flex; align-items: center; }
    .del-entry-btn:active { color: var(--red); }
    .manage-pad { padding: 3rem 1rem 0; }
    .manage-list { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 1rem; }
    .manage-item { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-bottom: 0.5px solid var(--border); }
    .manage-item:last-child { border-bottom: none; }
    .m-icon { width: 34px; height: 34px; border-radius: 10px; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 15px; color: var(--text2); flex-shrink: 0; }
    .m-lbl { flex: 1; font-size: 14px; color: var(--text); }
    .del-btn { background: none; border: none; cursor: pointer; color: var(--text3); font-size: 18px; padding: 4px; display: flex; align-items: center; }
    .del-btn:active { color: var(--red); }
    .add-box { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1rem; }
    .add-box-lbl { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text3); font-family: 'Space Mono', monospace; margin-bottom: 10px; }
    .add-input { width: 100%; padding: 11px 12px; font-size: 14px; border: 0.5px solid var(--border); border-radius: var(--radius); background: var(--bg); color: var(--text); font-family: 'Space Grotesk', sans-serif; outline: none; margin-bottom: 10px; }
    .add-input::placeholder { color: var(--text3); }
    .add-input:focus { border-color: var(--border2); }
    .icon-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin-bottom: 10px; }
    .icon-opt { background: var(--bg); border: 0.5px solid var(--border); border-radius: 8px; padding: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--text3); transition: all 0.1s; }
    .icon-opt.selected { background: var(--surface3); border-color: var(--border2); color: var(--text); }
    .add-cat-btn { width: 100%; padding: 12px; background: var(--accent); color: var(--accent-text); border: none; border-radius: var(--radius); font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; font-family: 'Space Grotesk', sans-serif; }
    .add-cat-btn:disabled { opacity: 0.2; cursor: default; }
    .empty { text-align: center; padding: 4rem 1rem; color: var(--text3); font-size: 12px; font-family: 'Space Mono', monospace; }
    .empty i { font-size: 32px; display: block; margin-bottom: 12px; }
    .flash { position: fixed; top: 2rem; left: 50%; transform: translateX(-50%); background: var(--surface3); border: 0.5px solid var(--border2); color: var(--green); padding: 10px 20px; border-radius: 100px; font-size: 12px; font-family: 'Space Mono', monospace; display: none; z-index: 200; white-space: nowrap; letter-spacing: 0.05em; }
  </style>
</head>
<body>
<div id="app">
  <div class="flash" id="flash">+ opgeslagen</div>

  <div class="screen active" id="screen-add">
    <div class="add-header">
      <div class="date-lbl" id="today-lbl"></div>
      <div class="amount-value empty" id="display">€ 0</div>
    </div>
    <div class="pad-area">
      <div class="numpad">
        <button class="num-btn" onclick="n('1')">1</button><button class="num-btn" onclick="n('2')">2</button><button class="num-btn" onclick="n('3')">3</button>
        <button class="num-btn" onclick="n('4')">4</button><button class="num-btn" onclick="n('5')">5</button><button class="num-btn" onclick="n('6')">6</button>
        <button class="num-btn" onclick="n('7')">7</button><button class="num-btn" onclick="n('8')">8</button><button class="num-btn" onclick="n('9')">9</button>
        <button class="num-btn" onclick="n('.')">.</button><button class="num-btn" onclick="n('0')">0</button>
        <button class="num-btn" onclick="del()"><i class="ti ti-backspace"></i></button>
      </div>
    </div>
    <div class="cat-section">
      <div class="section-lbl">Categorie</div>
      <div class="cat-grid" id="cat-grid"></div>
      <input class="note-input" type="text" id="note" placeholder="notitie (optioneel)" />
      <button class="save-btn" id="save-btn" onclick="save()" disabled>Opslaan</button>
    </div>
  </div>

  <div class="screen" id="screen-overview">
    <div class="overview-top">
      <div class="ov-month-nav">
        <button class="ov-month-btn" onclick="cm(-1)"><i class="ti ti-chevron-left"></i></button>
        <span class="ov-month-name" id="month-lbl"></span>
        <button class="ov-month-btn" onclick="cm(1)"><i class="ti ti-chevron-right"></i></button>
      </div>
      <div class="ov-total-lbl">Totaal uitgegeven</div>
      <div class="ov-total-val" id="total-val">€ 0</div>
    </div>
    <div class="chart-wrap">
      <div class="chart-lbl">Cumulatief deze maand</div>
      <canvas id="line-chart"></canvas>
    </div>
    <div class="cat-overview" id="cat-overview"></div>
  </div>

  <div class="screen" id="screen-entries">
    <div class="entries-pad">
      <div class="page-title">uitgaven</div>
      <div id="entries-list"></div>
    </div>
  </div>

  <div class="screen" id="screen-manage">
    <div class="manage-pad">
      <div class="page-title">categorieën</div>
      <div class="manage-list" id="manage-list"></div>
      <div class="add-box">
        <div class="add-box-lbl">Nieuwe categorie</div>
        <input class="add-input" type="text" id="new-name" placeholder="naam" maxlength="24" oninput="checkAdd()" />
        <div class="icon-grid" id="icon-grid"></div>
        <button class="add-cat-btn" id="add-btn" onclick="addCat()" disabled>Toevoegen</button>
      </div>
    </div>
  </div>

  <nav>
    <button class="nav-btn active" id="nav-add" onclick="show('add')"><i class="ti ti-plus"></i>invoer</button>
    <button class="nav-btn" id="nav-overview" onclick="show('overview')"><i class="ti ti-chart-line"></i>overzicht</button>
    <button class="nav-btn" id="nav-entries" onclick="show('entries')"><i class="ti ti-list"></i>lijst</button>
    <button class="nav-btn" id="nav-manage" onclick="show('manage')"><i class="ti ti-settings"></i>beheer</button>
  </nav>
</div>

<script>
const DEFAULT_CATS = [
  {id:'boodschappen',label:'Boodschappen',icon:'ti-shopping-cart'},
  {id:'eten',label:'Horeca',icon:'ti-coffee'},
  {id:'transport',label:'Transport',icon:'ti-train'},
  {id:'kleding',label:'Kleding',icon:'ti-shirt'},
  {id:'abonnementen',label:'Abonnementen',icon:'ti-refresh'},
  {id:'sport',label:'Sport & gezondheid',icon:'ti-heartbeat'},
  {id:'entertainment',label:'Entertainment',icon:'ti-device-tv'},
  {id:'huur',label:'Huur',icon:'ti-home'},
  {id:'overig',label:'Overig',icon:'ti-dots'}
];
const ICONS=['ti-shopping-bag','ti-coffee','ti-train','ti-shirt','ti-refresh','ti-heartbeat','ti-device-tv','ti-home','ti-car','ti-plane','ti-dog','ti-book','ti-tool','ti-gift','ti-phone','ti-music','ti-pill','ti-building','ti-briefcase','ti-pizza','ti-bike','ti-dots'];
const CATS_VERSION='2';

let raw='',selCat=null,selIcon=null,mo=0,entries=[],cats=[];

function load(){
  try{entries=JSON.parse(localStorage.getItem('ut_e')||'[]');}catch{entries=[];}
  try{
    const v=localStorage.getItem('ut_cv'),s=localStorage.getItem('ut_c');
    if(v===CATS_VERSION&&s){cats=JSON.parse(s);}
    else{cats=[...DEFAULT_CATS];localStorage.setItem('ut_cv',CATS_VERSION);}
  }catch{cats=[...DEFAULT_CATS];}
}
function persist(){
  localStorage.setItem('ut_e',JSON.stringify(entries));
  localStorage.setItem('ut_c',JSON.stringify(cats));
  localStorage.setItem('ut_cv',CATS_VERSION);
}
function gc(id){return cats.find(c=>c.id===id)||{label:id,icon:'ti-dots'};}

function setTodayLbl(){
  const d=new Date();
  document.getElementById('today-lbl').textContent=d.toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'});
}

function renderCats(){
  document.getElementById('cat-grid').innerHTML=cats.map(c=>
    `<button class="cat-btn${selCat===c.id?' selected':''}" onclick="sc('${c.id}')"><i class="ti ${c.icon}"></i>${c.label}</button>`
  ).join('');
}
function sc(id){selCat=id;renderCats();upd();}

function n(v){
  if(v==='.'&&raw.includes('.'))return;
  if(raw.length>=7)return;
  raw+=v;updDisp();upd();
}
function del(){raw=raw.slice(0,-1);updDisp();upd();}
function updDisp(){
  const val=parseFloat(raw)||0;
  const el=document.getElementById('display');
  const str=raw.endsWith('.')?val.toFixed(0)+'.':val%1===0?val.toFixed(0):val.toFixed(2);
  el.textContent='€ '+str;
  el.classList.toggle('empty',!raw);
}
function upd(){document.getElementById('save-btn').disabled=!(parseFloat(raw)>0&&selCat);}

function save(){
  const amt=parseFloat(raw);
  if(!amt||!selCat)return;
  entries.push({id:Date.now(),amount:amt,cat:selCat,note:document.getElementById('note').value.trim(),date:new Date().toISOString()});
  persist();
  raw='';selCat=null;document.getElementById('note').value='';
  updDisp();renderCats();upd();
  const f=document.getElementById('flash');
  f.style.display='block';setTimeout(()=>f.style.display='none',1400);
}

function getME(o){
  const now=new Date(),d=new Date(now.getFullYear(),now.getMonth()+o,1);
  return entries.filter(e=>{const ed=new Date(e.date);return ed.getFullYear()===d.getFullYear()&&ed.getMonth()===d.getMonth();});
}
function mLbl(o){
  const now=new Date();
  return new Date(now.getFullYear(),now.getMonth()+o,1).toLocaleDateString('nl-NL',{month:'long',year:'numeric'}).toUpperCase();
}
function cm(d){mo+=d;if(mo>0)mo=0;renderOverview();}

function drawChart(me,o){
  const canvas=document.getElementById('line-chart');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const W=canvas.parentElement.clientWidth-40,H=100;
  if(W<=0)return;
  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.scale(dpr,dpr);
  const now=new Date();
  const d=new Date(now.getFullYear(),now.getMonth()+o,1);
  const dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  const daily=Array(dim).fill(0);
  me.forEach(e=>{const day=new Date(e.date).getDate()-1;daily[day]=(daily[day]||0)+e.amount;});
  const cum=[];let run=0;
  daily.forEach(v=>{run+=v;cum.push(run);});
  const maxVal=Math.max(...cum,1);
  const pts=cum.map((v,i)=>({x:(i/(dim-1||1))*W,y:H-((v/maxVal)*(H*0.75))-H*0.1}));
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'rgba(240,240,240,0.1)');
  grad.addColorStop(1,'rgba(240,240,240,0)');
  ctx.beginPath();
  ctx.moveTo(pts[0].x,H);
  pts.forEach(p=>ctx.lineTo(p.x,p.y));
  ctx.lineTo(pts[pts.length-1].x,H);
  ctx.closePath();
  ctx.fillStyle=grad;ctx.fill();
  ctx.beginPath();
  ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++){
    const mx=(pts[i-1].x+pts[i].x)/2,my=(pts[i-1].y+pts[i].y)/2;
    ctx.quadraticCurveTo(pts[i-1].x,pts[i-1].y,mx,my);
  }
  ctx.lineTo(pts[pts.length-1].x,pts[pts.length-1].y);
  ctx.strokeStyle='rgba(240,240,240,0.5)';ctx.lineWidth=1.5;ctx.stroke();
  const ti=o===0?Math.min(now.getDate()-1,dim-1):dim-1;
  const tp=pts[ti];
  ctx.beginPath();ctx.arc(tp.x,tp.y,3.5,0,Math.PI*2);
  ctx.fillStyle='#f0f0f0';ctx.fill();
}

function renderOverview(){
  document.getElementById('month-lbl').textContent=mLbl(mo);
  const me=getME(mo),total=me.reduce((s,e)=>s+e.amount,0);
  document.getElementById('total-val').textContent='€ '+total.toFixed(2);
  setTimeout(()=>drawChart(me,mo),50);
  const bc={};me.forEach(e=>{bc[e.cat]=(bc[e.cat]||0)+e.amount;});
  const sorted=Object.entries(bc).sort((a,b)=>b[1]-a[1]);
  const maxAmt=sorted.length?sorted[0][1]:1;
  const el=document.getElementById('cat-overview');
  if(!sorted.length){el.innerHTML='<div class="empty"><i class="ti ti-receipt-off"></i>geen uitgaven</div>';return;}
  el.innerHTML=sorted.map(([cid,amt])=>{
    const cat=gc(cid),pct=Math.round((amt/maxAmt)*100);
    return `<div class="cat-ov-row"><div class="cat-ov-icon"><i class="ti ${cat.icon}"></i></div><div class="cat-ov-info"><div class="cat-ov-name">${cat.label}</div><div class="cat-ov-bar-wrap"><div class="cat-ov-bar" style="width:${pct}%"></div></div></div><div class="cat-ov-amt">€ ${amt.toFixed(2)}</div></div>`;
  }).join('');
}

function renderEntries(){
  const sorted=[...entries].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const el=document.getElementById('entries-list');
  if(!sorted.length){el.innerHTML='<div class="empty"><i class="ti ti-receipt-off"></i>nog geen uitgaven</div>';return;}
  const groups={};
  sorted.forEach(e=>{
    const d=new Date(e.date),key=d.toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'});
    if(!groups[key])groups[key]=[];groups[key].push(e);
  });
  el.innerHTML=Object.entries(groups).map(([day,es])=>
    `<div><div class="day-lbl">${day}</div>${es.map(e=>{
      const cat=gc(e.cat);
      return `<div class="entry-card"><div class="entry-icon"><i class="ti ${cat.icon}"></i></div><div class="entry-info"><div class="entry-cat">${cat.label}</div>${e.note?`<div class="entry-note">${e.note}</div>`:''}</div><div class="entry-right"><div class="entry-amt">€ ${e.amount.toFixed(2)}</div><button class="del-entry-btn" onclick="delEntry(${e.id})"><i class="ti ti-trash"></i></button></div></div>`;
    }).join('')}</div>`
  ).join('');
}

function delEntry(id){entries=entries.filter(e=>e.id!==id);persist();renderEntries();}

function renderManage(){
  document.getElementById('manage-list').innerHTML=cats.map(c=>
    `<div class="manage-item"><div class="m-icon"><i class="ti ${c.icon}"></i></div><div class="m-lbl">${c.label}</div><button class="del-btn" onclick="delCat('${c.id}')"><i class="ti ti-trash"></i></button></div>`
  ).join('');
  document.getElementById('icon-grid').innerHTML=ICONS.map(ic=>
    `<button class="icon-opt${selIcon===ic?' selected':''}" onclick="pi('${ic}')"><i class="ti ${ic}"></i></button>`
  ).join('');
}
function pi(ic){selIcon=ic;renderManage();checkAdd();}
function checkAdd(){document.getElementById('add-btn').disabled=!(document.getElementById('new-name').value.trim()&&selIcon);}
function addCat(){
  const name=document.getElementById('new-name').value.trim();
  if(!name||!selIcon)return;
  cats.push({id:'cat_'+Date.now(),label:name,icon:selIcon});
  persist();document.getElementById('new-name').value='';selIcon=null;
  checkAdd();renderManage();renderCats();
}
function delCat(id){
  if(cats.length<=1)return;
  cats=cats.filter(c=>c.id!==id);persist();
  if(selCat===id){selCat=null;upd();}
  renderManage();renderCats();
}

function show(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.getElementById('nav-'+name).classList.add('active');
  if(name==='overview')renderOverview();
  if(name==='entries')renderEntries();
  if(name==='manage')renderManage();
}

load();renderCats();updDisp();setTodayLbl();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
</body>
</html>
